name: json_rpc_codegen_builder
description: A dart code generator that generates typed client and server code for the json_rpc_2 package.
version: 2.1.1
homepage: https://github.com/Skycoder42/json_rpc_codegen
repository: https://github.com/Skycoder42/json_rpc_codegen.git

environment:
  sdk: ^3.13.0
resolution: workspace

platforms:
  linux:
  macos:
  windows:

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  build: ^4.0.10
  build_config: ^1.3.2
  code_builder: ^4.11.1
  collection: ^1.19.1
  dart_test_tools: ^7.3.0
  json_rpc_codegen: ^2.1.1
  meta: ^1.19.0
  source_gen: ^4.2.4
  source_helper: ^1.3.13

dev_dependencies:
  build_runner: ^2.16.0
  dart_pre_commit: ^6.1.4
  json_rpc_2: ^4.1.0
  mockito: ^5.8.1
  test: ^1.31.1

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - analyzer
      - collection
      - meta
