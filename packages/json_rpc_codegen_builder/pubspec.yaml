name: json_rpc_codegen_builder
description: A dart code generator that generates typed client and server code for the json_rpc_2 package.
version: 1.0.0
homepage: https://github.com/Skycoder42/json_rpc_codegen
repository: https://github.com/Skycoder42/json_rpc_codegen.git

environment:
  sdk: ^3.12.0
resolution: workspace

platforms:
  linux:
  macos:
  windows:

dependencies:
  analyzer: ">=12.1.0 <14.0.0"
  build: ^4.0.7
  build_config: ^1.3.2
  code_builder: ^4.11.1
  collection: ^1.19.1
  dart_test_tools: ^7.2.9
  json_rpc_codegen: ^1.1.0
  meta: ^1.18.0
  source_gen: ^4.2.4
  source_helper: ^1.3.12

dev_dependencies:
  build_runner: ^2.15.1
  dart_pre_commit: ^6.1.3
  json_rpc_2: ^4.1.0
  mockito: ^5.6.4
  test: ^1.31.0

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - analyzer
      - collection
      - meta
